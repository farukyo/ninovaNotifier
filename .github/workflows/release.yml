name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        default: patch
        type: choice
        # Varsayılan "patch" seçeneklerde yoktu; form varsayılanla gönderilemiyordu.
        options:
          - patch
          - minor
          - major
      version:
        description: "Optional exact version override (e.g. 0.3.0)"
        required: false
        type: string
      release_notes:
        description: "Kullanıcıya gönderilecek changelog (boş bırakırsan varsayılan mesaj gider)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Bump, Tag, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Resolve next version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION=$(uv run python scripts/bump_version.py --set-version "${{ github.event.inputs.version }}" --write)
          else
            NEW_VERSION=$(uv run python scripts/bump_version.py --bump "${{ github.event.inputs.bump }}" --write)
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate code quality
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Sync lock file
        run: uv lock

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "No version change detected; skipping commit and tag."
            exit 1
          fi
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ github.event.inputs.release_notes }}
          generate_release_notes: true

